// ---------- aleatoriedad con semilla (todos los celulares calculan lo mismo) ----------
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function rng(s){let a=hash(s)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setup(){
 $(`<h1>Los 80 de la abuela</h1><p class="sm">Un juego para conversar entre edades, de 6 a 15 personas (para probarlo, desde 4). Este es el celular que reemplaza las cartas durante el playtest; el juego final es de cartas, sin pantallas.</p>
 <div class="card"><label>La historia</label><p>La abuela cumple 80 años. Cuando ella nació, la familia armó una cápsula del tiempo y la fue llenando en algunos de sus cumpleaños. Hoy la destapan entre todos y se ríen con lo que encuentran adentro.</p><p>Esta noche arman otra para abrirla dentro de otros 80 años. Es una fiesta, no una despedida: lo que importa es qué quieren que lleguen a conocer los que vienen.</p><p>Cada equipo es una rama de la familia y quiere llenar su baúl con cierto tipo de cosas. Pero no pueden decirlo directamente: tienen que pedirlo «de lado», conversando.</p></div>
 <div class="card"><label>Para empezar</label>
 <p class="sm">Siéntense primero, todos en círculo y sin saber en qué equipo quedan. Después cada quien entra aquí con los mismos datos.</p>
 <label>Código de la partida (lo inventan entre todos)</label><input id="c" placeholder="ej: abuela80" autocapitalize="none" autocomplete="off">
 <label>Cuántos jugadores hay (4 a 15)</label><input id="n" type="number" min="4" max="15" inputmode="numeric">
 <label>Tu número de silla (1, 2, 3… en círculo, sin repetir)</label><input id="s" type="number" min="1" max="15" inputmode="numeric">
 <p class="sm">El código puede ser cualquier palabra, pero tiene que ser exactamente la misma en todos los celulares. Cada código es una partida distinta: si quieren repetir, usen otro. Con 4 o 5 jugadores se quitan los encargos difíciles.</p>
 <button onclick="start()">Entrar a la partida</button></div>
 <button class="alt" onclick="reglas()">Leer las reglas completas</button>`)}
function reglas(){
 $(`<h2>Las reglas completas</h2>
 <div class="card"><label>Qué es</label><p>Un juego de equipos. Cada equipo tiene un encargo secreto que dice qué quiere que haya en su baúl. Para lograrlo, todos hablan a la vez sin decir directamente lo que necesitan.</p></div>
 <div class="card"><label>Los equipos</label><p>De 6 a 10 jugadores hay 2 equipos; de 11 a 15, 3 equipos. Los equipos son los mismos toda la partida y quedan intercalados en el círculo, con rivales en medio. Se arman por la silla en que te sientas, sin importar la edad.</p></div>
 <div class="card"><label>Los objetos</label><p>Hay 37 objetos de la casa de la abuela. Cada ronda recibes 2 que solo ves tú. Cada objeto tiene etiquetas: suena; casi no se ve hoy; de la cocina o el patio; de madera o metal; cabe en una caja de zapatos; no cabe. Un objeto cuenta para todas sus etiquetas.</p></div>
 <div class="card"><label>El encargo</label><p>Son tres líneas, por ejemplo «al menos 1 objeto que suena», «máximo 1 de madera o metal» o «exactamente 2 de la cocina o el patio». Cada línea cumplida da 1 punto, o 2 si es difícil. No hace falta cumplirlas todas.</p></div>
 <div class="card"><label>La costumbre</label><p>Cada ronda sale una forma de hablar para toda la mesa: sin mostrar los dientes, en lenguisopa, como locutor de radio… Sirve para reírse y para que hablar sea más fácil que callar.</p></div>
 <div class="card"><label>Una ronda, paso a paso</label><ol><li><b>Encargo y costumbre.</b> Lees tu encargo (solo tu equipo lo sabe) y la costumbre (es pública).</li><li><b>Charla 1 · 2 minutos.</b> Todos hablan a la vez. No puedes decir directamente lo que necesitas: ni nombres de objetos, ni palabras de etiqueta (suena, casi no se ve, cocina, patio, madera, metal, cabe, caja de zapatos), ni cantidades. Pide «de lado»: «¿alguien tiene algo que sonaba en la sala los domingos?».</li><li><b>Cambio.</b> Quien quiera suelta 1 o 2 cartas y recibe otras.</li><li><b>Charla 2 · 30 segundos.</b> Mismas reglas.</li><li><b>Al baúl.</b> Cada quien elige 1 o 2 de sus cartas.</li><li><b>Conteo.</b> El equipo junta lo que puso en el baúl, se cuentan las etiquetas y se suman los puntos.</li></ol></div>
 <div class="card"><label>Si alguien rompe una regla</label><p>Si rompes la costumbre o dices una palabra prohibida, cualquier rival te puede decir «¡prohibida!». La primera vez en la ronda solo puedes cambiar 1 carta; la segunda, pierdes el cambio. Las dudas las resuelve cada equipo.</p></div>
 <div class="card"><label>Cómo se gana</label><p>Son 4 rondas. Gana el equipo con más puntos al final. Si hay empate arriba, comparten la victoria. Nadie sale del juego.</p></div>
 <div class="card"><label>Ojo con el celular</label><p>Esta versión es para probar el juego. El celular reparte tus cartas y cuenta el tiempo, pero lo importante es la mesa: mírense, hablen y levanten la vista.</p></div>
 <button onclick="S?render():setup()">Volver</button>`)}
function start(){
 const c=document.getElementById('c').value.trim().toLowerCase(),n=+document.getElementById('n').value,s=+document.getElementById('s').value;
 if(!c||n<4||n>15||s<1||s>n){alert('Revisa los datos: código, jugadores de 4 a 15 y silla entre 1 y el número de jugadores.');return}
 if(S&&0){}
 S={code:c,n,seat:s,r:0,step:'preparar',rounds:[0,1,2,3].map(()=>({inf:0,hand:null,swapped:false,placed:[],count:[],counted:false,pts:null})),score:{}};
 save();render()}
// ---------- rondas ----------
function render(){
 if(!S){return setup()}
 const f={preparar:vPreparar,equipo:vEquipo,charla1:vCharla1,cambio:vCambio,charla2:vCharla2,baul:vBaul,conteo:vConteo,puntos:vPuntos,fin:vFin}[S.step];f()}
function go(s){S.step=s;save();render()}
function vEquipo(){
 const t=team(),e=encOf(S.r,t),c=cosOf(S.r);
 if(!R().hand){R().hand=hand0(S.r);save()}
 $(head()+`<h2>Tus cartas</h2>${guide('Qué hacer en este paso',(S.r==0?'Empieza la ronda 1. ':'Empieza la ronda '+(S.r+1)+'. ')+'Mira tus 2 objetos (toca para verlos, solo tú) y lee el encargo secreto de tu equipo: te dice qué quiere tener el baúl. Lee también la costumbre de la ronda: es pública y todos hablan así durante la charla. Piensa qué objeto tuyo ayuda al encargo y qué te gustaría recibir. No muestres la pantalla a rivales.','la charla de 2 minutos, cuando todos hayan leído')}<p class="sm">Solo las ves tú. Toca para mostrarlas u ocultarlas.</p><div id="h">${R().hand.map(i=>objCard(O(i),'hide','onclick="this.classList.toggle(\'hide\')"')).join('')}</div>
 <div class="card"><label>Encargo secreto de tu equipo</label><p class="sm"><i>${e.v}:</i> «${e.q}»</p><div id="e" class="hide" onclick="this.classList.toggle('hide')"><ul>${e.L.map(l=>`<li>${l.t} <span class="sm">(${l.p} pt${l.p>1?'s':''})</span></li>`).join('')}</ul></div><p class="sm">Toca para mostrar. No lo digas directamente.</p></div>
 <div class="card" style="background:var(--mu);color:#fff"><label style="color:#fff">Costumbre de la ronda (pública)</label><h2 style="color:#fff;margin:4px 0">${c.t}</h2>${c.x}</div>
 <button onclick="go('charla1')">Empezar la charla (2 min)</button>`)}
function guide(h,body,next){return `<div class="guide"><b>${h}</b><br>${body}${next?`<div class="nx">Después → ${next}</div>`:''}</div>`}
function mates(){const T=tcount(),t=team(),m=[];for(let i=1;i<=S.n;i++)if((i-1)%T==t&&i!=S.seat)m.push(i);return m}
function vPreparar(){const t=team(),m=mates();
 $(`<div class="top"><span>Antes de empezar · <a href="#" style="color:inherit" onclick="salir();return false">salir</a> · <a href="#" style="color:inherit" onclick="reglas();return false">reglas</a></span></div>
 <h2>Tu equipo</h2>
 <div class="card" style="text-align:center"><span class="team" style="background:${TC[t]};font-size:20px;padding:8px 20px">${TN[t]}</span><p>Estás en la silla ${S.seat}. ${m.length?'Tus compañeros están en las sillas <b>'+m.join(', ')+'</b>.':'Tu equipo no tiene más personas.'} Los demás son rivales, y están sentados entre ustedes.</p><p class="sm">En el juego de cartas esto se descubre mirando la letra de la carta de equipo; aquí lo calcula el celular. Las rondas no cambian de equipo.</p></div>
 ${guide('Qué hay que hacer ahora','1. Verifiquen que todos entraron con el mismo código y el mismo número de jugadores, y que cada quien tiene una silla distinta.<br>2. Tengan a la mano una hoja y un lápiz por equipo: es la hoja del baúl, para anotar lo que van poniendo. En el juego final es una hoja impresa con el dibujo del baúl.<br>3. Cuando todos estén listos, empiecen.','la ronda 1')}
 <button onclick="go('equipo')">Estamos listos</button>`)}
let TI=null;
function timer(sec,next,key){
 clearInterval(TI);TI=null;let t=sec,run=false;
 const draw=()=>{const el=document.getElementById('tm');if(el)el.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
 draw();
 window.tgl=()=>{run=!run;document.getElementById('bt').textContent=run?'Pausar':'Seguir';if(run&&!TI)TI=setInterval(()=>{if(!run)return;t--;draw();if(t<=0){clearInterval(TI);TI=null;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}document.getElementById('bt').textContent='¡Tiempo!';run=false;t=0;draw()}},1000)};
 setTimeout(window.tgl,0)}
function infBox(){return `<div class="card"><div class="row"><div><label>Infracciones tuyas esta ronda</label><div class="cnt">${R().inf}</div></div><button class="sage" onclick="R().inf++;save();render2()">Me cantaron una</button><button class="alt" style="flex:0 0 56px" onclick="R().inf=Math.max(0,R().inf-1);save();render2()">−1</button></div>
 <p class="sm">1.ª: solo cambias 1 carta. 2.ª: pierdes el cambio. Las disputas las resuelve cada equipo.</p></div>`}
function render2(){document.querySelector('.cnt').textContent=R().inf}
function prohib(){return `<div class="card"><label>Prohibido decir</label><ul>${D.prohib.map(p=>`<li>${p}</li>`).join('')}</ul><p class="sm">Pide «de lado»: «¿alguien tiene algo que sonaba en la sala los domingos?»</p></div>`}
function vCharla1(){const c=cosOf(S.r);
 $(head()+`<h2>Charla 1</h2><div class="timer" id="tm">2:00</div><button id="bt" onclick="tgl()">Pausar</button>
 ${guide('Qué hacer en este paso','Todos hablan a la vez durante 2 minutos, con la costumbre de la ronda. Intenten que sus compañeros de equipo entiendan qué necesitas, o descubre qué tienen ellos, sin decir nada de la lista de abajo. Pregunta «de lado», con recuerdos y descripciones. Si alguien rompe una regla, cualquier rival le dice «¡prohibida!» y esa persona toca «Me cantaron una».','el cambio de cartas, cuando suene el tiempo o se acabe la charla')}
 <div class="card" style="background:var(--mu);color:#fff"><b>${c.t}</b><br>${c.x}</div>`+prohib()+infBox()+`<button class="alt" onclick="clearInterval(TI);TI=null;go('cambio')">Pasar al cambio</button>`);timer(120)}
function vCambio(){
 SEL=[];
 const max=R().inf>=2?0:R().inf==1?1:2;
 const h=R().hand;
 $(head()+`<h2>Cambio de cartas</h2>${guide('Qué hacer en este paso','Si quieres, toca las cartas que sueltas (1 o 2, según tus infracciones) y pulsa el botón: se devuelven al mazo y recibes otras. Si estás conforme con tus cartas, sigue sin cambiar. Solo se puede hacer una vez por ronda.','la charla de 30 segundos')}<p>${max==0?'Perdiste el cambio.':'Puedes cambiar hasta '+max+' carta'+(max>1?'s':'')+'.'} Los descartes se barajan con el mazo y robas nuevas.</p>
 <div id="sw">${h.map(i=>objCard(O(i),'','onclick="pick(this,'+i+','+max+')"')).join('')}</div>
 <button id="do" onclick="doSwap()" ${R().swapped?'disabled':''}>${R().swapped?'Ya cambiaste':'Cambiar las elegidas (o seguir con las mismas)'}</button>
 <button class="alt" onclick="go('charla2')">Siguiente: charla de 30 s</button>`)}
let SEL=[];
function pick(el,i,max){if(R().swapped||!max)return;const k=SEL.indexOf(i);if(k>=0){SEL.splice(k,1);el.classList.remove('sel')}else if(SEL.length<max){SEL.push(i);el.classList.add('sel')}}
function doSwap(){
 const h=R().hand,keep=h.filter(i=>!SEL.includes(i));
 const pool=shuf(D.objs.map(o=>o.id),S.code+'|swap|'+S.r+'|'+S.seat).filter(i=>!keep.includes(i));
 const nu=pool.slice(0,SEL.length);R().hand=keep.concat(nu);R().swapped=true;SEL=[];save();render()}
function vCharla2(){const c=cosOf(S.r);
 $(head()+`<h2>Charla 2</h2><div class="timer" id="tm">0:30</div><button id="bt" onclick="tgl()">Pausar</button>
 ${guide('Qué hacer en este paso','Una charla rápida de 30 segundos, con las mismas reglas y la misma costumbre. Ya tienes tus cartas nuevas: es el momento de afinar con tu equipo qué conviene guardar en el baúl, sin decir lo prohibido.','poner cartas en el baúl')}
 <div class="card" style="background:var(--mu);color:#fff"><b>${c.t}</b><br>${c.x}</div>
 <div id="h">${R().hand.map(i=>objCard(O(i),'hide','onclick="this.classList.toggle(\'hide\')"')).join('')}</div>`+`<button class="alt" onclick="clearInterval(TI);TI=null;go('baul')">Poner en el baúl</button>`);timer(30)}
function vBaul(){
 const h=R().hand;SEL=R().placed.slice();
 $(head()+`<h2>¿Qué metes al baúl?</h2>${guide('Qué hacer en este paso','Elige 1 o 2 de tus cartas y ponlas boca abajo en la hoja del baúl de tu equipo (la hoja impresa o un papel con el dibujo de un baúl). Las que no pongas se quedan contigo y no cuentan. Los rivales no deben verlas. Cuando todos hayan puesto, ya pueden abrir.','el conteo')}<p>Elige 1 o 2. Ponlas boca abajo en la hoja del baúl de tu equipo.</p>
 ${h.map(i=>objCard(O(i),SEL.includes(i)?'sel':'','onclick="pickB(this,'+i+')"')).join('')}
 <button onclick="if(!SEL.length)return alert('Elige al menos una');R().placed=SEL.slice();go('conteo')">Ya las puse</button>`)}
function pickB(el,i){const k=SEL.indexOf(i);if(k>=0){SEL.splice(k,1);el.classList.remove('sel')}else if(SEL.length<2){SEL.push(i);el.classList.add('sel')}}
function evalLine(l,cnt){const v=cnt[l.k]||0;return l.o=='>='?v>=l.n:l.o=='<='?v<=l.n:v==l.n}
function vConteo(){
 const t=team(),e=encOf(S.r,t);
 if(!R().counted){R().count=R().placed.slice();R().counted=true;save()}
 const cnt={};R().count.forEach(i=>{O(i).l.split('').forEach(k=>cnt[k]=(cnt[k]||0)+1)});
 let tot=0;const rows=e.L.map(l=>{const ok=evalLine(l,cnt);if(ok)tot+=l.p;return `<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${l.t} <span class="sm">(${l.p})</span></li>`}).join('');
 $(head()+`<h2>Conteo</h2>${guide('Qué hacer en este paso','Den vuelta a las cartas del baúl del equipo y marquen aquí cuáles son (toca cada nombre). El celular cuenta las etiquetas y revisa cada línea del encargo: ✓ suma sus puntos, ✗ no suma. Las líneas con «exactamente» valen doble. Si una carta está mal marcada, tócala de nuevo.','guardar los puntos y ver el marcador')}<p class="sm">Abran el baúl del equipo. Toca los objetos que haya ahí (los tuyos ya están marcados).</p>
 <div>${D.objs.map(o=>`<span class="chip ${R().count.includes(o.id)?'':'x'}" style="font-size:14px;padding:6px 10px;cursor:pointer" onclick="tg(${o.id})">${o.n}</span>`).join('')}</div>
 <div class="card"><label>Lo que hay en el baúl</label><div>${Object.keys(D.lab).map(k=>`${D.lab[k]}: <b>${cnt[k]||0}</b>`).join('<br>')}</div></div>
 <div class="card"><label>Encargo</label><ul style="list-style:none;padding:0">${rows}</ul><div class="cnt">${tot} punto${tot==1?'':'s'}</div></div>
 <button onclick="R().pts=${tot};save();go('puntos')">Guardar puntos</button>`)}
function tg(i){const c=R().count,k=c.indexOf(i);k>=0?c.splice(k,1):c.push(i);save();render()}
function vPuntos(){
 const T=tcount();
 $(head()+`<h2>Marcador</h2>${guide('Qué hacer en este paso','Pregunta a los otros equipos cuántos puntos hicieron en esta ronda y escríbelos en su columna. Las demás casillas se pueden corregir cuando quieras. '+(S.r<3?'Entre rondas: junten los objetos de todos, barájenlos y repártanse 2 a cada uno.':'Es la última ronda: miren quién ganó.'),S.r<3?'la siguiente ronda (nuevo encargo y nueva costumbre)':'el final')}<p class="sm">Tu equipo ya tiene sus puntos. Escribe los de los otros equipos.</p>
 <div class="card"><table><tr><th></th>${[...Array(T).keys()].map(t=>`<th style="color:${TC[t]}">${'ABC'[t]}</th>`).join('')}</tr>
 ${[0,1,2,3].map(r=>`<tr><td>R${r+1}</td>${[...Array(T).keys()].map(t=>`<td>${t==team()?(S.rounds[r].pts==null?'–':S.rounds[r].pts):`<input style="width:56px;padding:4px;margin:0" inputmode="numeric" value="${(S.score[r+'_'+t]??'')}" onchange="S.score['${r}_${t}']=this.value;save();render()">`}</td>`).join('')}</tr>`).join('')}
 <tr><th>Total</th>${[...Array(T).keys()].map(t=>`<th>${[0,1,2,3].reduce((a,r)=>a+(+(t==team()?S.rounds[r].pts:S.score[r+'_'+t])||0),0)}</th>`).join('')}</tr></table></div>
 ${S.r<3?`<p class="sm">Entre rondas: junten todos los objetos, barájenlos y reparten 2 a cada uno.</p><button onclick="S.r++;go('equipo')">Siguiente ronda</button>`:`<button onclick="go('fin')">Terminar partida</button>`}`)}
function vFin(){$(`<h1>¡Feliz cumpleaños, abuela!</h1><p>Ya está lista la cápsula para dentro de otros 80 años.</p>${(()=>{const T=tcount(),tot=[...Array(T).keys()].map(t=>[0,1,2,3].reduce((a,r)=>a+(+(t==team()?S.rounds[r].pts:S.score[r+'_'+t])||0),0)),m=Math.max(...tot),w=tot.map((v,i)=>v==m?TN[i]:null).filter(x=>x);return guide('Cómo terminó','Con los puntos anotados: '+tot.map((v,i)=>TN[i]+' '+v).join(', ')+'. '+(w.length>1?'Empate: comparten la victoria ('+w.join(' y ')+').':'Gana el '+w[0]+'.'),'')})()}<div class="card"><p class="sm">Para el playtest, anota: ¿pedir «de lado» funcionó? ¿Cuántas infracciones hubo? ¿La charla 2 hizo falta? ¿Cuánto duró cada ronda?</p></div><button class="alt" onclick="S=null;try{localStorage.removeItem('b80')}catch(e){};setup()">Nueva partida</button>`)}
try{if(navigator.wakeLock){navigator.wakeLock.request('screen').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.wakeLock.request('screen').catch(()=>{})})}}catch(e){}
render();
</script></body></html>
